spring:
  application:
    name: ilililissue
  profiles:
    default: local
  jpa:
    open-in-view: false
    # 스키마는 Flyway(src/main/resources/db/migration)가 만들고, Hibernate는 엔티티와 맞는지만 확인한다.
    hibernate:
      ddl-auto: validate

auth:
  jwt-secret: ${JWT_SECRET:}
  access-token-ttl: 30m
  refresh-token-ttl: 14d
  cookie-secure: true
  allowed-origins: ${ALLOWED_ORIGINS:}

# 이용 기록 보관 기간(가안 1년). 바꾸면 개인정보 처리방침 2장도 고친다.
metrics:
  event-retention: 365d

# 뉴스 자동 초안: 매일 07:00 언론사 RSS 수집 → Claude가 이슈 초안 작성 → DRAFT로 등록(게시는 관리자가 검수 후).
# 키가 없으면 관리자 수동 실행은 설정 오류로 응답한다.
# 피드 목록은 2026-10-29에 응답을 확인했다. 운영 전에 언론사별 RSS 이용 조건(상업적 이용, AI 입력)을 확인하거나 허락을 받는다.
# 매일경제는 봇 차단(Cloudflare)이라 넣지 않았다. 차단을 우회하지 않는다.
news-draft:
  enabled: ${NEWS_DRAFT_ENABLED:false}
  feeds:
    - { publisher: 연합뉴스, url: "https://www.yna.co.kr/rss/news.xml" }
    - { publisher: 한겨레, url: "https://www.hani.co.kr/rss" }
    - { publisher: 경향신문, url: "https://www.khan.co.kr/rss/rssdata/total_news.xml" }
    - { publisher: 동아일보, url: "https://rss.donga.com/total.xml" }
    - { publisher: 조선일보, url: "https://www.chosun.com/arc/outboundfeeds/rss/?outputType=xml" }
    - { publisher: SBS, url: "https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=01&plink=RSSREADER" }
    - { publisher: 한국경제, url: "https://www.hankyung.com/feed/all-news" }
    - { publisher: 뉴시스, url: "https://www.newsis.com/RSS/sokbo.xml" }
  articles-per-feed: 40
  max-articles: 200
  max-drafts: 3
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  model: claude-opus-5-5

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ilililissue}
    username: ${DB_USERNAME:ilililissue}
    password: ${DB_PASSWORD}

auth:
  cookie-secure: false
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

---
# 운영: docker-compose.prod.yml에서 SPRING_PROFILES_ACTIVE=prod로 실행한다. 쿠키 Secure는 기본값(true)을 쓴다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# Caddy가 보낸 X-Forwarded-* 헤더로 원래 스킴·호스트를 인식한다.
server:
  forward-headers-strategy: framework
