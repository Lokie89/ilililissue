spring:
  application:
    name: ilililissue
  profiles:
    default: local
  jpa:
    open-in-view: false
    # 스키마는 Flyway(src/main/resources/db/migration)가 만들고, Hibernate는 엔티티와 맞는지만 확인한다.
    hibernate:
      ddl-auto: validate

auth:
  jwt-secret: ${JWT_SECRET:}
  access-token-ttl: 30m
  refresh-token-ttl: 14d
  cookie-secure: true
  allowed-origins: ${ALLOWED_ORIGINS:}

# 이용 기록 보관 기간(가안 1년). 바꾸면 개인정보 처리방침 2장도 고친다.
metrics:
  event-retention: 365d

# 뉴스 자동 초안: 매일 07:00 네이버 뉴스 검색 → Claude가 이슈 초안 작성 → DRAFT로 등록(게시는 관리자가 검수 후).
# 키가 없으면 스케줄은 꺼 두고, 관리자 수동 실행은 설정 오류로 응답한다.
news-draft:
  enabled: ${NEWS_DRAFT_ENABLED:false}
  keywords: ${NEWS_DRAFT_KEYWORDS:정부 정책,국회 법안,경제,물가,부동산,노동,교육,복지,환경,사회 논란}
  articles-per-keyword: 30
  max-articles: 200
  max-drafts: 3
  naver-client-id: ${NAVER_CLIENT_ID:}
  naver-client-secret: ${NAVER_CLIENT_SECRET:}
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  model: claude-opus-5-5

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ilililissue}
    username: ${DB_USERNAME:ilililissue}
    password: ${DB_PASSWORD}

auth:
  cookie-secure: false
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

---
# 운영: docker-compose.prod.yml에서 SPRING_PROFILES_ACTIVE=prod로 실행한다. 쿠키 Secure는 기본값(true)을 쓴다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# Caddy가 보낸 X-Forwarded-* 헤더로 원래 스킴·호스트를 인식한다.
server:
  forward-headers-strategy: framework
