spring:
  application:
    name: ilililissue
  profiles:
    default: local
  jpa:
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ilililissue}
    username: ${DB_USERNAME:ilililissue}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
