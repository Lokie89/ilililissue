spring:
  application:
    name: ilililissue
  profiles:
    default: local
  jpa:
    open-in-view: false

auth:
  jwt-secret: ${JWT_SECRET:}
  access-token-ttl: 30m
  refresh-token-ttl: 14d
  cookie-secure: true
  allowed-origins: ${ALLOWED_ORIGINS:}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ilililissue}
    username: ${DB_USERNAME:ilililissue}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

auth:
  cookie-secure: false
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
