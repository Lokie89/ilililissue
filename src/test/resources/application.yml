spring:
  application:
    name: ilililissue
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  # 테스트는 H2에 Hibernate가 스키마를 만든다. 마이그레이션 검증은 FlywayMigrationTest가 따로 한다.
  flyway:
    enabled: false

auth:
  jwt-secret: test-secret-key-for-ilililissue-at-least-32-bytes
  access-token-ttl: 30m
  refresh-token-ttl: 14d
  cookie-secure: false
  allowed-origins: http://localhost:3000
