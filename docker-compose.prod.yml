# 단일 서버 운영 구성: Caddy(HTTPS) → web(Next.js), api(Spring Boot) → db(MySQL)
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 자세한 절차는 deploy/README.md 참고.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ilililissue
      MYSQL_USER: ${DB_USERNAME:-ilililissue}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/ilililissue
      DB_USERNAME: ${DB_USERNAME:-ilililissue}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGINS: https://${DOMAIN}
      NEWS_DRAFT_ENABLED: ${NEWS_DRAFT_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JAVA_OPTS: ${API_JAVA_OPTS:--Xmx512m}
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://api:8080
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8080
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
